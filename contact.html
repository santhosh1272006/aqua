<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Contact AquaZen water delivery."
    >

    <title>Contact Us | AquaZen</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <div id="site-header"></div>


    <main>

        <!-- PAGE HERO -->

        <section class="page-hero">

            <div class="container">

                <span class="eyebrow">
                    CONTACT US
                </span>

                <h1>
                    Let's get your
                    <span>water sorted.</span>
                </h1>

                <p>
                    Questions, delivery checks, business supply
                    or order support — send us a message.
                </p>

            </div>

        </section>


        <!-- CONTACT SECTION -->

        <section class="section">

            <div class="container contact-grid">


                <!-- CONTACT DETAILS -->

                <div>

                    <span class="eyebrow">
                        GET IN TOUCH
                    </span>

                    <h2>
                        We are here to help.
                    </h2>


                    <div class="contact-items">


                        <!-- PHONE -->

                        <div>

                            <span>
                                📞
                            </span>

                            <div>

                                <small>
                                    Call us
                                </small>

                                <b>
                                    +91 93454 86145
                                </b>

                            </div>

                        </div>


                        <!-- EMAIL -->

                        <div>

                            <span>
                                ✉️
                            </span>

                            <div>

                                <small>
                                    Email
                                </small>

                                <b>
                                    hello@aquazenwater.com
                                </b>

                            </div>

                        </div>


                        <!-- SERVICE -->

                        <div>

                            <span>
                                📍
                            </span>

                            <div>

                                <small>
                                    Service
                                </small>

                                <b>
                                    Local delivery areas
                                </b>

                            </div>

                        </div>


                        <!-- SUPPORT HOURS -->

                        <div>

                            <span>
                                🕘
                            </span>

                            <div>

                                <small>
                                    Support hours
                                </small>

                                <b>
                                    8:00 AM – 8:00 PM
                                </b>

                            </div>

                        </div>


                    </div>

                </div>



                <!-- CONTACT FORM -->

                <form
                    class="form-card"
                    data-form="contact"
                >

                    <label>

                        Name

                        <input
                            required
                            type="text"
                            name="name"
                            placeholder="Your full name"
                        >

                    </label>


                    <label>

                        Email

                        <input
                            required
                            type="email"
                            name="email"
                            placeholder="you@example.com"
                        >

                    </label>


                    <label>

                        Phone

                        <input
                            required
                            type="tel"
                            name="phone"
                            placeholder="+91 98765 43210"
                        >

                    </label>


                    <label>

                        Message

                        <textarea
                            required
                            name="message"
                            rows="5"
                            placeholder="How can we help?"
                        ></textarea>

                    </label>


                    <button
                        class="btn btn-primary full"
                        type="submit"
                    >
                        Send Message
                    </button>


                    <div
                        class="form-message"
                        aria-live="polite"
                    ></div>

                </form>


            </div>

        </section>


    </main>


    <div id="site-footer"></div>


    <script src="script.js"></script>

</body>

</html>
