<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | AquaZen</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-body">

    <div id="site-header"></div>

    <main class="auth-main">

        <div class="auth-card">

            <a class="auth-logo" href="index.html">
                <span>💧</span> AquaZen
            </a>

            <span class="eyebrow">WELCOME BACK</span>

            <h1>Log in to your account.</h1>

            <p>
                Login to your AquaZen account to order
                20-liter drinking water cans.
            </p>


            <form class="auth-form" data-form="login">

                <label>
                    Email

                    <input
                        required
                        type="email"
                        name="email"
                        placeholder="you@example.com"
                    >
                </label>


                <label>
                    Password

                    <input
                        required
                        type="password"
                        name="password"
                        placeholder="••••••••"
                    >
                </label>


                <div class="auth-row">

                    <label class="check">
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="contact.html">
                        Need help?
                    </a>

                </div>


                <button
                    class="btn btn-primary full"
                    type="submit"
                >
                    Login
                </button>


                <div
                    class="form-message"
                    aria-live="polite"
                ></div>

            </form>


            <p class="auth-bottom">
                Don't have an account?

                <a href="register.html">
                    Create one
                </a>
            </p>

        </div>

    </main>


    <div id="site-footer"></div>


    <script src="script.js"></script>

</body>

</html>
